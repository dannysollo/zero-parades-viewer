<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zero Parades — Dialogue Viewer</title>
<style>
  :root {
    --bg: #1e1f22; --panel: #2b2d31; --border: #3f4147; --text: #dcddde;
    --muted: #8e9297; --accent: #5865f2; --accent-text: #ffffff;
    --card-bg: #313338; --tag-bg: #3f4147; --canvas-bg: #202225;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f3f5; --panel: #ffffff; --border: #d4d7dc; --text: #1e1f22;
      --muted: #5c6067; --accent: #5865f2; --accent-text: #ffffff;
      --card-bg: #ffffff; --tag-bg: #e3e5e8; --canvas-bg: #e9eaed;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }
  #app { display: flex; height: 100vh; }
  #sidebar {
    width: 380px; min-width: 260px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; background: var(--panel);
  }
  #tabs { display: flex; border-bottom: 1px solid var(--border); }
  #tabs button {
    flex: 1; padding: 9px 4px; background: none; border: none; color: var(--muted);
    font-size: 11px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent;
  }
  #tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  #search { padding: 10px; border-bottom: 1px solid var(--border); }
  #search input {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  #stats { padding: 6px 12px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); }
  #filterChip {
    margin: 8px 10px 0 10px; padding: 5px 10px; border-radius: 6px; background: var(--accent);
    color: var(--accent-text); font-size: 11.5px; display: none; align-items: center; justify-content: space-between;
  }
  #filterChip button { background: none; border: none; color: inherit; cursor: pointer; font-size: 13px; font-weight: 700; }

  #flowList, #charList, #skillList, #searchResults { flex: 1; overflow-y: auto; }
  .flow-item, .char-item, .skill-item, .search-item {
    padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 12.5px;
  }
  .flow-item:hover, .char-item:hover, .skill-item:hover, .search-item:hover { background: var(--tag-bg); }
  .flow-item.active { background: var(--accent); color: var(--accent-text); }
  .flow-item .fid { font-family: monospace; font-size: 11px; opacity: 0.7; }
  .flow-item .prev { margin-top: 2px; opacity: 0.85; }
  .flow-item .chip { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--tag-bg); margin-right: 4px; }
  .flow-item.active .chip { background: rgba(255,255,255,0.25); }
  .char-item, .skill-item { display: flex; justify-content: space-between; align-items: center; }
  .char-item .name, .skill-item .name { font-weight: 600; }
  .char-item .count, .skill-item .count { font-size: 11px; color: var(--muted); }
  .search-item .sspeaker { font-weight: 700; font-size: 12px; }
  .search-item .stext { margin-top: 2px; opacity: 0.9; }
  .search-item .stext mark { background: #ffd166; color: #1a1a1a; border-radius: 2px; }
  .search-item .smeta { font-size: 10.5px; color: var(--muted); margin-top: 3px; }

  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #toolbar {
    padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; color: var(--muted); flex-wrap: wrap;
  }
  #toolbar button {
    padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); cursor: pointer; font-size: 12px;
  }
  #toolbar button:hover { background: var(--tag-bg); }
  #toolbar button:disabled { opacity: 0.4; cursor: default; }
  #toolbar button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  #viewArea { flex: 1; position: relative; overflow: hidden; }
  #placeholder { color: var(--muted); padding: 40px; text-align: center; }

  /* Reader mode */
  #readerScroll { position: absolute; inset: 0; overflow-y: auto; padding: 20px 24px; display: none; }
  .card {
    max-width: 720px; margin: 0 auto 14px auto; padding: 14px 16px; border-radius: 10px;
    background: var(--card-bg); border: 1px solid var(--border);
  }
  .card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .badge {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 2px 7px; border-radius: 5px; background: var(--tag-bg); color: var(--muted); font-weight: 600;
  }
  .badge.bark, .badge.dialog-fragment, .badge.janus-card { background: var(--accent); color: var(--accent-text); }
  .badge.start, .badge.end { background: #3ba55d; color: white; }
  .badge.fork { background: #faa61a; color: #222; }
  .badge.hub { background: #949cf7; color: #1a1a2e; }
  .badge.jump { background: #ed4245; color: white; }
  .cardid { font-family: monospace; font-size: 10.5px; color: var(--muted); }
  .speaker { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
  .line { font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
  .alt-note { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .kv { font-size: 12px; margin: 2px 0; }
  .kv b { color: var(--muted); font-weight: 600; }
  .branches { max-width: 720px; margin: 0 auto 20px auto; display: flex; flex-direction: column; gap: 6px; }
  .branch-btn {
    text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer; font-size: 13px;
  }
  .branch-btn:hover { border-color: var(--accent); }
  .branch-btn .pin { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-right: 6px; }
  details.raw { max-width: 720px; margin: 0 auto 20px auto; }
  details.raw summary { cursor: pointer; font-size: 11.5px; color: var(--muted); }
  details.raw pre {
    font-size: 11px; background: var(--tag-bg); padding: 10px; border-radius: 6px; overflow-x: auto; max-height: 300px;
  }
  .deadend { max-width: 720px; margin: 0 auto; text-align: center; color: var(--muted); font-size: 13px; padding: 10px; }
  .checkinfo { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .condition-text { font-size: 13px; color: var(--muted); margin-top: 8px; font-style: italic; }
  .modifiers { margin-top: 6px; }
  .mod-row { font-size: 11.5px; margin: 2px 0; }
  .mod-pos { color: #3ba55d; font-weight: 700; }
  .mod-neg { color: #ed4245; font-weight: 700; }
  .mod-neu { color: var(--muted); font-weight: 700; }

  /* Graph mode */
  #graphWrap { position: absolute; inset: 0; overflow: hidden; background: var(--canvas-bg); cursor: grab; }
  #graphWrap.panning { cursor: grabbing; }
  #graphSvg { position: absolute; top: 0; left: 0; }
  .gnode-box {
    border-radius: 8px; border: 2px solid var(--border); background: var(--card-bg);
    width: 100%; height: 100%; padding: 6px 8px; font-size: 11px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-start; cursor: pointer;
  }
  .gnode-box.selected { border-color: #ffd166; box-shadow: 0 0 0 2px #ffd16688; }
  .gnode-box.highlight { border-color: #ffd166; }
  .gnode-box.dimmed { opacity: 0.18; }
  .gnode-box .gtype {
    font-size: 8.5px; text-transform: uppercase; font-weight: 700; opacity: 0.7; margin-bottom: 2px;
  }
  .gnode-box .gspeaker { font-weight: 700; font-size: 10.5px; }
  .gnode-box .gtext {
    font-size: 10.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .gnode-box.type-start, .gnode-box.type-end { background: #1f4a2f; border-color: #3ba55d; }
  .gnode-box.type-bark, .gnode-box.type-frag, .gnode-box.type-janus { background: #2b2d5c; border-color: var(--accent); }
  .gnode-box.type-fork { background: #4a3a12; border-color: #faa61a; }
  .gnode-box.type-hub { background: #35335c; border-color: #949cf7; }
  .gnode-box.type-jump { background: #4a1f22; border-color: #ed4245; }
  .gnode-box.type-passive { background: #1f4a3a; border-color: #3ba57a; }
  .gnode-box.type-antipassive { background: #4a2530; border-color: #d1495b; }
  .gnode-box.type-check { background: #3a3d42; border-color: #9aa0a6; }
  .gnode-box.type-external { background: transparent; border-style: dashed; opacity: 0.8; }
  .gnode-box .gskill { font-size: 9.5px; opacity: 0.85; margin-top: 2px; }
  .gnode-box .gcondition {
    font-size: 9px; opacity: 0.85; margin-top: 2px; font-style: italic;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  @media (prefers-color-scheme: light) {
    .gnode-box.type-start, .gnode-box.type-end { background: #d7f2df; }
    .gnode-box.type-bark, .gnode-box.type-frag, .gnode-box.type-janus { background: #e1e2fb; }
    .gnode-box.type-fork { background: #ffedcf; }
    .gnode-box.type-hub { background: #e6e6fb; }
    .gnode-box.type-jump { background: #fbdada; }
    .gnode-box.type-passive { background: #d8f2e6; }
    .gnode-box.type-antipassive { background: #f9dde1; }
    .gnode-box.type-check { background: #e4e5e7; }
  }

  #detailPanel {
    position: absolute; top: 12px; right: 12px; width: 320px; max-height: calc(100% - 24px);
    overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.25); display: none; z-index: 10;
  }
  #detailPanel h3 { margin: 0 0 6px 0; font-size: 13px; }
  #detailPanel .closeBtn { float: right; cursor: pointer; color: var(--muted); font-weight: 700; }
  #detailPanel pre { font-size: 10.5px; background: var(--tag-bg); padding: 8px; border-radius: 6px; overflow-x: auto; max-height: 240px; }
  #legend, .legend-box {
    position: absolute; bottom: 12px; left: 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 10.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap;
    max-width: 320px;
  }
  #legend span, .legend-box span { display: flex; align-items: center; gap: 4px; }
  #legend i, .legend-box i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* Universe mode (all conversations at once, canvas-rendered for scale) */
  #universeWrap { position: absolute; inset: 0; overflow: hidden; background: var(--canvas-bg); cursor: grab; }
  #universeWrap.panning { cursor: grabbing; }
  #universeCanvas { position: absolute; top: 0; left: 0; }
  #universeLoading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.4); color: white; font-size: 14px; z-index: 5;
  }
  #universeLoadingText {
    background: var(--panel); color: var(--text); padding: 16px 24px; border-radius: 10px; border: 1px solid var(--border);
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="tabs">
      <button id="tabFlows" class="active">Flows</button>
      <button id="tabChars">Characters</button>
      <button id="tabSkills">Skills</button>
      <button id="tabSearch">Search</button>
    </div>
    <div id="search"><input id="searchBox" placeholder="Search flows (id / speaker / text)..." /></div>
    <div id="filterChip"><span id="filterChipText"></span><button id="clearFilter">&times;</button></div>
    <div id="stats"></div>
    <div id="flowList"></div>
    <div id="charList" style="display:none"></div>
    <div id="skillList" style="display:none"></div>
    <div id="searchResults" style="display:none"></div>
  </div>
  <div id="main">
    <div id="toolbar">
      <button id="graphModeBtn" class="active">Graph</button>
      <button id="readerModeBtn">Reader</button>
      <button id="universeModeBtn">All Conversations</button>
      <span style="width:1px;height:16px;background:var(--border)"></span>
      <button id="backBtn" disabled>&larr; Back</button>
      <button id="restartBtn" disabled>&#8635; Restart</button>
      <button id="zoomResetBtn" disabled>Reset zoom</button>
      <button id="copyLinkBtn" title="Copy a link to this exact view">&#128279; Copy link</button>
      <span id="crumbInfo"></span>
    </div>
    <div id="viewArea">
      <div id="placeholder">Pick a flow on the left, or browse by character, to start reading.</div>
      <div id="readerScroll"></div>
      <div id="graphWrap">
        <svg id="graphSvg" width="0" height="0"></svg>
        <div id="legend"></div>
      </div>
      <div id="universeWrap" style="display:none">
        <canvas id="universeCanvas"></canvas>
        <div id="universeLoading" style="display:none">
          <div id="universeLoadingText">Loading all conversations...</div>
        </div>
        <div id="universeLegend" class="legend-box"></div>
      </div>
      <div id="detailPanel"></div>
    </div>
  </div>
</div>

<script>
const TEXT_TYPES = new Set(["RtBarkCard", "RtC4DialogueFragmentCard", "RtJanusCard"]);
const CHECK_TYPES = new Set(["RtPassiveCard", "RtAntiPassiveCard", "RtWhiteCheckCard", "RtRedCheckCard"]);
const SKILL_NAMES = {
  coordination: "Coordination", inference: "Inference", nerve: "Nerve", wits: "Wits",
  entanglement: "Entanglement", inspiration: "Inspiration", affect: "Affect", presence: "Presence",
  awareness: "Awareness", motivation: "Motivation", recall: "Recall", focus: "Focus",
  vigour: "Vigour", muscle: "Muscle", senses: "Senses",
};
function prettySkill(id) {
  if (!id) return null;
  return SKILL_NAMES[id] || (id.charAt(0).toUpperCase() + id.slice(1));
}
function prettyCardType(node) {
  const t = node.m_cardType || node.type;
  return t.replace(/[-_]/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}
function hasDialogueText(node, nodes) {
  const cd = cardDataMap(node);
  return cd.dialog_lines !== undefined || cd.description !== undefined;
}
function resolveModifiers(nodes, modifierRid) {
  // modifier -> RtPropertyGroupData.m_childProperties[] -> each a group of {bonus, condition, explanation}
  const group = nodes[String(modifierRid)];
  if (!group || !group.m_childProperties) return [];
  const out = [];
  for (const ref of group.m_childProperties) {
    const sub = nodes[String(ref.rid)];
    if (!sub || !sub.m_childProperties) continue;
    let bonus = null, explanation = null;
    for (const propRef of sub.m_childProperties) {
      const prop = nodes[String(propRef.rid)];
      if (!prop) continue;
      if (prop.m_name === "bonus") bonus = prop.m_value;
      else if (prop.m_name === "explanation") explanation = prop.m_value;
    }
    if (bonus !== null || explanation) out.push({ bonus, explanation });
  }
  return out;
}
function checkInfoHtml(node, nodes) {
  if (!CHECK_TYPES.has(node.type)) return "";
  const parts = [];
  const skill = prettySkill(node.m_skillID);
  if (skill) parts.push(`<b>Skill:</b> ${escapeHtml(skill)}`);
  if (node.m_threshold !== undefined) parts.push(`<b>Difficulty:</b> ${escapeHtml(String(node.m_threshold))}`);
  let html = parts.length ? `<div class="checkinfo">${parts.join(" &nbsp;·&nbsp; ")}</div>` : "";
  const cd = cardDataMap(node);
  if (cd.modifier) {
    const mods = resolveModifiers(nodes, cd.modifier.rid);
    if (mods.length) {
      html += `<div class="modifiers">` + mods.map(m => {
        const sign = m.bonus > 0 ? "+" : "";
        const cls = m.bonus > 0 ? "mod-pos" : (m.bonus < 0 ? "mod-neg" : "mod-neu");
        return `<div class="mod-row"><span class="${cls}">${sign}${m.bonus ?? "?"}</span>${m.explanation ? " " + escapeHtml(m.explanation) : ""}</div>`;
      }).join("") + `</div>`;
    }
  }
  return html;
}
function prettyGateName(hookName) {
  const short = (hookName || "").replace(/^gates\./, "").replace(/^instructions\./, "");
  return short.replace(/([a-z0-9])([A-Z])/g, "$1 $2");
}
function resolveCondition(nodes, rid, depth = 0) {
  if (rid === undefined || rid === null || rid == -2 || depth > 12) return null;
  const node = nodes[String(rid)];
  if (!node) return null;
  switch (node.type) {
    case "RtStructuredConditionPropertyData":
      return resolveCondition(nodes, node.m_condition ? node.m_condition.rid : null, depth + 1);
    case "RtStructuredConditionLogicalAND":
      return (node.m_children || []).map(c => resolveCondition(nodes, c.rid, depth + 1) || "?").join(" AND ");
    case "RtStructuredConditionLogicalOR":
      return "(" + (node.m_children || []).map(c => resolveCondition(nodes, c.rid, depth + 1) || "?").join(" OR ") + ")";
    case "RtStructuredConditionLogicalNOT": {
      const child = (node.m_children || [])[0];
      return "NOT " + (child ? (resolveCondition(nodes, child.rid, depth + 1) || "?") : "?");
    }
    case "RtStructuredConditionFlag":
      return `Flag Set(${node.m_flagName || "?"})`;
    case "RtStructuredConditionHook": {
      const call = node.m_hookCall || {};
      const args = (call.m_args || []).map(a => resolveLeaf(nodes, a.rid));
      const argStr = args.map(a => a === null ? "?" : a).join(", ");
      return `${prettyGateName(call.m_hookName)}(${argStr})`;
    }
    default:
      return null;
  }
}
function forkConditionText(node, nodes) {
  const cd = cardDataMap(node);
  const condRef = cd.structured_condition || cd.condition;
  if (!condRef) return null;
  return resolveCondition(nodes, condRef.rid);
}
const chunkCache = new Map();
let flowsIndex = [], characters = [], skills = [];
let flowFileMap = new Map();
let currentFile = null, currentChunk = null, currentFlowId = null, currentChunkId = null;
let historyStack = [];
let viewMode = "graph";
let activeFilter = null; // {type: "character"|"skill", value}
let searchIndex = [];
let currentTab = "flows";

async function loadJSON(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`fetch failed: ${path} (${res.status})`);
  return res.json();
}
async function getChunk(file) {
  if (chunkCache.has(file)) return chunkCache.get(file);
  const data = await loadJSON(file);
  chunkCache.set(file, data);
  return data;
}
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function resolveLeaf(nodes, rid) {
  if (rid === undefined || rid === null || rid == -2) return null;
  const node = nodes[String(rid)];
  if (!node) return null;
  if (["RtStringPropertyData","RtWritableStringPropertyData","RtIntPropertyData","RtWritableIntPropertyData","RtBoolPropertyData","RtWritableBoolPropertyData"].includes(node.type)) return node.m_value;
  return null;
}
function cardDataMap(node) {
  const out = {};
  const cd = node.m_cardData || {};
  const keys = cd.m_keys || [], values = cd.m_values || [];
  for (let i = 0; i < keys.length; i++) out[keys[i]] = values[i];
  return out;
}
function speakerAndText(node, nodes) {
  const cd = cardDataMap(node);
  const text = resolveLeaf(nodes, (cd.dialog_lines || {}).rid) || resolveLeaf(nodes, (cd.description || {}).rid);
  const speaker = resolveLeaf(nodes, (cd.character_short_name || {}).rid);
  return { speaker, text };
}
function nodeTypeClass(node) {
  if (!node) return "external";
  if (node.type === "RtStartCard") return "start";
  if (node.type === "RtEndCard") return "end";
  if (node.type === "RtC4ForkCard") return "fork";
  if (node.type === "RtC4HubCard") return "hub";
  if (node.type === "RtC4JumpCard") return "jump";
  if (node.type === "RtPassiveCard") return "passive";
  if (node.type === "RtAntiPassiveCard") return "antipassive";
  if (node.type === "RtWhiteCheckCard" || node.type === "RtRedCheckCard") return "check";
  if (hasDialogueText(node)) {
    if (node.type === "RtJanusCard") return "janus";
    if (node.type === "RtBarkCard") return "bark";
    return "frag";
  }
  return "other";
}
function cardBodyHtml(node, nodes) {
  const cd = cardDataMap(node);
  if (hasDialogueText(node)) {
    const { speaker, text } = speakerAndText(node, nodes);
    const altCount = resolveLeaf(nodes, (cd.alternativesCount || {}).rid);
    let html = speaker ? `<div class="speaker">${escapeHtml(speaker)}</div>` : "";
    html += `<div class="line">${escapeHtml(text || "(no text)")}</div>`;
    if (altCount) html += `<div class="alt-note">+${altCount} conditional alternative line(s) not shown</div>`;
    html += checkInfoHtml(node, nodes);
    return html;
  }
  if (node.type === "RtStartCard") return `<div class="line" style="color:var(--muted)">— start of flow —</div>`;
  if (node.type === "RtEndCard") return `<div class="line" style="color:var(--muted)">— end of flow —</div>`;
  if (node.type === "RtC4ForkCard") {
    const condText = forkConditionText(node, nodes);
    return `<div class="line" style="color:var(--muted)">Condition check (branches: pass / fail)</div>` +
      (condText ? `<div class="condition-text">IF ${escapeHtml(condText)}</div>` : `<div class="alt-note">(condition not resolvable)</div>`);
  }
  if (node.type === "RtC4HubCard") return `<div class="line" style="color:var(--muted)">Hub (checkpoint / convergence point)</div>`;
  if (node.type === "RtC4JumpCard") return `<div class="line" style="color:var(--muted)">Jump &rarr;</div>`;
  if (node.type === "RtFlowReferenceCard") return `<div class="line" style="color:var(--muted)">Flow reference (dynamic property <code>${escapeHtml(node.m_flowPropertyID || "?")}</code>)</div>`;
  let kvHtml = "";
  for (const [k, v] of Object.entries(cd)) {
    const resolved = resolveLeaf(nodes, (v || {}).rid);
    kvHtml += `<div class="kv"><b>${escapeHtml(k)}:</b> ${resolved !== null ? escapeHtml(String(resolved)) : `<i>(complex, see raw)</i>`}</div>`;
  }
  return kvHtml || `<div class="line" style="color:var(--muted)">(no card data)</div>`;
}
function summarizeText(node, nodes) {
  const { speaker, text } = hasDialogueText(node) ? speakerAndText(node, nodes) : {};
  const t = (text || "").slice(0, 60);
  let label = speaker ? `${speaker}: ${t}` : (t || prettyCardType(node));
  if (CHECK_TYPES.has(node.type)) {
    const skill = prettySkill(node.m_skillID);
    if (skill) label += ` [${skill}]`;
  }
  return label;
}

  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx)) + "<mark>" + escapeHtml(text.slice(idx, idx + q.length)) + "</mark>" + escapeHtml(text.slice(idx + q.length));
}
function renderSearchResults(query) {

/* ---------------- flow selection / shared state ---------------- */
async function resolveCardTarget(cardId, flowId) {
  let chunk = currentChunk, file = currentFile;
  if (!chunk.flows[flowId]) {
    const targetFile = flowFileMap.get(flowId);
    if (!targetFile) return null;
    file = targetFile;
    chunk = await getChunk(targetFile);
  }
  const rid = (chunk.flows[flowId] || {})[cardId];
  if (rid === undefined) return null;
  const node = chunk.nodes[String(rid)];
  if (!node) return null;
  return { file, rid: String(rid), nodes: chunk.nodes, node };
}

async function selectFlow(flowId, file, jumpRid = null) {
  currentChunk = await getChunk(file);
  currentFile = file;
  currentFlowId = flowId;
  currentChunkId = currentChunk.chunkId;

  document.querySelectorAll(".flow-item").forEach(el => {
    el.classList.toggle("active", el.dataset.flowId === flowId && el.dataset.file === file);
  });
  document.getElementById("placeholder").style.display = "none";
  document.getElementById("crumbInfo").textContent = `${currentChunkId} — ${currentFlowId}`;

  if (viewMode === "universe") {
    // picking a specific flow is a strong signal to focus on just that one --
    // drop back to the single-conversation Graph view rather than trying to
    // fly to it inside the (possibly not-yet-loaded) universe.
    viewMode = "graph";
    hideAllModeViews();
    document.getElementById("graphModeBtn").classList.add("active");
    document.getElementById("graphWrap").style.display = "block";
    document.getElementById("backBtn").style.display = "none";
    document.getElementById("restartBtn").style.display = "none";
    document.getElementById("zoomResetBtn").style.display = "inline-block";
  }
  if (viewMode === "graph") await openGraph(flowId, file, jumpRid);
  else await openReaderStart(flowId, file, jumpRid);
  // note: openGraph/openReaderStart/navigateTo/onNodeClick each already call
  // updateHash() themselves with the right node context — nothing to do here.
}

function updateHash(node) {
  const params = new URLSearchParams();
  params.set("m", viewMode);
  if (currentFile) params.set("f", currentFile);
  if (currentFlowId) params.set("fl", currentFlowId);
  if (node) params.set("n", node);
  history.replaceState(null, "", "#" + params.toString());
}
function parseHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  const file = params.get("f"), flowId = params.get("fl");
  if (!file || !flowId) return null;
  return { mode: params.get("m") || "graph", file, flowId, node: params.get("n") || null };
}

}

/* ================= READER MODE ================= */
async function openReaderStart(flowId, file, jumpRid = null) {
  if (jumpRid) {
    historyStack = [];
    await navigateTo(file, jumpRid);
    return;
  }
  const cardMap = currentChunk.flows[flowId] || {};
  let startRid = null;
  for (const [cardId, rid] of Object.entries(cardMap)) {
    const node = currentChunk.nodes[String(rid)];
    if (node && node.type === "RtStartCard") { startRid = rid; break; }
  }
  if (startRid === null) startRid = Object.values(cardMap)[0] ?? null;
  historyStack = [];
  if (startRid !== null) await navigateTo(file, startRid);
  else document.getElementById("readerScroll").innerHTML = `<div class="deadend">No cards found for this flow.</div>`;
}
async function navigateTo(file, rid, pushHistory = true) {
  if (file !== currentFile) { currentChunk = await getChunk(file); currentFile = file; }
  const key = `${file}::${rid}`;
  if (pushHistory) {
    const top = historyStack[historyStack.length - 1];
    if (!top || `${top.file}::${top.rid}` !== key) historyStack.push({ file, rid });
  }
  await renderReaderCard(rid);
  document.getElementById("backBtn").disabled = historyStack.length <= 1;
  document.getElementById("restartBtn").disabled = false;
  const node = currentChunk.nodes[String(rid)];
  currentFlowId = node ? node.m_flowId : currentFlowId;
  currentChunkId = currentChunk.chunkId;
  document.getElementById("crumbInfo").textContent = `${currentChunkId} — ${currentFlowId} — step ${historyStack.length}`;
  updateHash(rid);
}
document.getElementById("backBtn").addEventListener("click", async () => {
  if (historyStack.length > 1) {
    historyStack.pop();
    const prev = historyStack[historyStack.length - 1];
    await navigateTo(prev.file, prev.rid, false);
    document.getElementById("backBtn").disabled = historyStack.length <= 1;
  }
});
document.getElementById("restartBtn").addEventListener("click", async () => {
  if (historyStack.length) {
    const first = historyStack[0];
    historyStack = [first];
    await navigateTo(first.file, first.rid, false);
    document.getElementById("backBtn").disabled = true;
  }
});

async function renderReaderCard(rid) {
  const nodes = currentChunk.nodes;
  const node = nodes[String(rid)];
  const scriptEl = document.getElementById("readerScroll");
  scriptEl.innerHTML = "";
  if (!node) { scriptEl.innerHTML = `<div class="deadend">Unresolved reference (rid ${rid}).</div>`; return; }

  const cardType = node.m_cardType || node.type;
  const cardDiv = document.createElement("div");
  cardDiv.className = "card";
  cardDiv.innerHTML = `
    <div class="head">
      <span class="badge ${cardType}">${escapeHtml(prettyCardType(node))}</span>
    </div>
    ${cardBodyHtml(node, nodes)}
  `;
  scriptEl.appendChild(cardDiv);

  const raw = document.createElement("details");
  raw.className = "raw";
  raw.innerHTML = `<summary>raw node data</summary><pre>${escapeHtml(JSON.stringify(node, null, 1))}</pre>`;
  scriptEl.appendChild(raw);

  const children = node.m_children || [];
  const outputPins = node.m_outputPins || [];
  const branchTargets = [];
  for (const childRef of children) {
    const edgeNode = nodes[String(childRef.rid)];
    if (!edgeNode || edgeNode.type !== "RtOutputPinEdges") continue;
    const pinIndex = edgeNode.m_outputPinIndex;
    const pinName = outputPins[pinIndex] ? outputPins[pinIndex].m_name : null;
    for (const cardRef of (edgeNode.m_cardsReferences || [])) {
      branchTargets.push({ pinName, cardId: cardRef.m_cardId, flowId: cardRef.m_flowId });
    }
  }
  if (branchTargets.length === 0) {
    const de = document.createElement("div");
    de.className = "deadend";
    de.textContent = node.type === "RtEndCard" ? "" : "(no further branches from this card)";
    scriptEl.appendChild(de);
  } else {
    const branchesDiv = document.createElement("div");
    branchesDiv.className = "branches";
    scriptEl.appendChild(branchesDiv);
    for (const bt of branchTargets) {
      const target = await resolveCardTarget(bt.cardId, bt.flowId);
      const btn = document.createElement("button");
      btn.className = "branch-btn";
      let label;
      if (!target) { label = `(unresolved reference)`; btn.disabled = true; }
      else {
        label = summarizeText(target.node, target.nodes);
        if (target.file !== currentFile) label += `  [other flow]`;
      }
      btn.innerHTML = `${bt.pinName ? `<span class="pin">${escapeHtml(bt.pinName)}</span>` : ""}${escapeHtml(label)}`;
      if (target) btn.addEventListener("click", () => navigateTo(target.file, target.rid));
      branchesDiv.appendChild(btn);
    }
  }
}

/* ================= GRAPH MODE ================= */
const COL_W = 250, COL_GAP = 60, ROW_H = 118, ROW_GAP = 16;
const NODE_W = 210, NODE_H = 108;
let currentGraph = null; // {nodes: Map(key->{...,depth,lane}), edges: [...]}
let selectedNodeKey = null;
let connectedKeys = null; // Set of node keys directly connected to selectedNodeKey, or null if nothing selected
let panX = 0, panY = 40, zoom = 1;

function computeConnectedKeys(key) {
  const set = new Set([key]);
  for (const e of currentGraph.edges) {
    if (e.from === key) set.add(e.to);
    if (e.to === key) set.add(e.from);
  }
  return set;
}

async function openGraph(flowId, file, jumpRid = null) {
  document.getElementById("detailPanel").style.display = "none";
  selectedNodeKey = null;
  connectedKeys = null;
  currentGraph = await buildGraph(flowId, file);
  panX = 0; panY = 40; zoom = 1;
  document.getElementById("zoomResetBtn").disabled = false;
  drawGraph();
  if (jumpRid && currentGraph.gnodes.has(String(jumpRid))) {
    const gn = currentGraph.gnodes.get(String(jumpRid));
    centerOnNode(gn);
    await onNodeClick(gn); // also sets the hash for this specific node
  } else {
    updateHash();
  }
}
function centerOnNode(gn) {
  const { x, y } = nodeXY(gn);
  const rect = document.getElementById("graphWrap").getBoundingClientRect();
  zoom = 1;
  panX = rect.width / 2 - (x + NODE_W / 2) * zoom;
  panY = rect.height / 2 - (y + NODE_H / 2) * zoom;
  drawGraph();
}

function buildFlowGraphFromChunk(flowId, chunk) {
  const cardMap = chunk.flows[flowId] || {};
  const nodes = chunk.nodes;
  const gnodes = new Map(); // key -> {key, node, external, depth, flowId, cardId}
  const edges = []; // {from, to, pinName}

  let starts = [];
  for (const [cardId, rid] of Object.entries(cardMap)) {
    const n = nodes[String(rid)];
    if (n && n.type === "RtStartCard") starts.push(String(rid));
  }
  if (starts.length === 0) starts = Object.values(cardMap).slice(0, 1).map(String);

  const queue = starts.map(rid => ({ key: rid, depth: 0 }));
  const visited = new Set();
  while (queue.length) {
    const { key, depth } = queue.shift();
    if (visited.has(key)) continue;
    visited.add(key);
    const node = nodes[key];
    if (!node) continue;
    gnodes.set(key, { key, node, external: false, depth });

    const children = node.m_children || [];
    const outputPins = node.m_outputPins || [];
    for (const childRef of children) {
      const edgeNode = nodes[String(childRef.rid)];
      if (!edgeNode || edgeNode.type !== "RtOutputPinEdges") continue;
      const pinIndex = edgeNode.m_outputPinIndex;
      const pinName = outputPins[pinIndex] ? outputPins[pinIndex].m_name : null;
      for (const cardRef of (edgeNode.m_cardsReferences || [])) {
        if (cardRef.m_flowId === flowId && cardMap[cardRef.m_cardId] !== undefined) {
          const targetKey = String(cardMap[cardRef.m_cardId]);
          edges.push({ from: key, to: targetKey, pinName });
          if (!visited.has(targetKey)) queue.push({ key: targetKey, depth: depth + 1 });
        } else {
          const extKey = `ext:${cardRef.m_flowId}:${cardRef.m_cardId}`;
          if (!gnodes.has(extKey)) {
            gnodes.set(extKey, { key: extKey, external: true, depth: depth + 1, flowId: cardRef.m_flowId, cardId: cardRef.m_cardId });
          } else {
            gnodes.get(extKey).depth = Math.min(gnodes.get(extKey).depth, depth + 1);
          }
          edges.push({ from: key, to: extKey, pinName });
        }
      }
    }
  }

  // assign lanes within each depth column, in discovery order
  const byDepth = new Map();
  for (const gn of gnodes.values()) {
    if (!byDepth.has(gn.depth)) byDepth.set(gn.depth, []);
    byDepth.get(gn.depth).push(gn);
  }
  for (const [depth, arr] of byDepth) {
    arr.forEach((gn, i) => { gn.lane = i; });
  }

  return { gnodes, edges, flowId, nodes };
}

async function buildGraph(flowId, file) {
  const chunk = await getChunk(file);
  const result = buildFlowGraphFromChunk(flowId, chunk);
  result.file = file;
  return result;
}

function nodeXY(gn) {
  const x = gn.depth * (COL_W + COL_GAP) + 20;
  const y = gn.lane * (ROW_H + ROW_GAP) + 20;
  return { x, y };
}

function syncSvgToContainer(svg) {
  // Keep the viewBox in exact 1:1 sync with the container's rendered pixel
  // size. If the viewBox instead scaled to fit graph content (which can be
  // huge), mouse coordinates (CSS px) and pan/zoom math (viewBox units) end
  // up in different scales, making zoom drift toward the origin and pan feel
  // sluggish or fast depending on how big the current graph happens to be.
  const rect = document.getElementById("graphWrap").getBoundingClientRect();
  const w = Math.max(rect.width, 1), h = Math.max(rect.height, 1);
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
}
window.addEventListener("resize", () => {
  if (currentGraph) syncSvgToContainer(document.getElementById("graphSvg"));
});

function drawGraph() {
  const svg = document.getElementById("graphSvg");
  svg.innerHTML = "";
  if (!currentGraph) return;

  const pos = new Map();
  for (const gn of currentGraph.gnodes.values()) {
    const { x, y } = nodeXY(gn);
    pos.set(gn.key, { x, y });
  }

  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("id", "viewport");
  g.setAttribute("transform", `translate(${panX},${panY}) scale(${zoom})`);
  syncSvgToContainer(svg);

  // edges first (under nodes)
  // Different pins (e.g. "fail" and "critical_failure") sometimes converge on
  // the exact same target node. Since a curve is purely a function of its two
  // node centers, edges sharing an identical (from,to) pair would otherwise
  // draw exactly on top of one another. Fan them out with a small vertical
  // offset per group so each stays visually distinct.
  const edgeGroupTotals = new Map();
  for (const e of currentGraph.edges) {
    const key = `${e.from}=>${e.to}`;
    edgeGroupTotals.set(key, (edgeGroupTotals.get(key) || 0) + 1);
  }
  const edgeGroupSeen = new Map();
  const EDGE_FAN = 14;

  function edgeColor(e) {
    const pin = (e.pinName || "").toLowerCase();
    if (pin.includes("critical")) return "#c246d1";
    if (pin === "fail" || pin === "failure") return "#ed4245";
    if (pin === "success") return "#3ba55d";
    if (pin === "default" && currentGraph.gnodes.get(e.from)?.node?.type === "RtC4ForkCard") return "#3ba55d";
    return "#8e9297";
  }

  for (const e of currentGraph.edges) {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) continue;
    const key = `${e.from}=>${e.to}`;
    const total = edgeGroupTotals.get(key);
    const seenIdx = edgeGroupSeen.get(key) || 0;
    edgeGroupSeen.set(key, seenIdx + 1);
    const fanOffset = total > 1 ? (seenIdx - (total - 1) / 2) * EDGE_FAN : 0;
    const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2 + fanOffset;
    const x2 = b.x, y2 = b.y + NODE_H / 2 + fanOffset;
    const mx = (x1 + x2) / 2;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
    const color = edgeColor(e);
    path.setAttribute("stroke", color);
    path.setAttribute("stroke-width", "1.6");
    path.setAttribute("fill", "none");
    const edgeDimmed = connectedKeys && e.from !== selectedNodeKey && e.to !== selectedNodeKey;
    path.setAttribute("opacity", edgeDimmed ? "0.1" : "0.75");
    g.appendChild(path);
    if (e.pinName && e.pinName !== "default") {
      const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", mx);
      label.setAttribute("y", (y1 + y2) / 2 - 4);
      label.setAttribute("fill", color);
      label.setAttribute("font-size", "9");
      label.setAttribute("text-anchor", "middle");
      label.textContent = e.pinName;
      g.appendChild(label);
    }
  }

  // nodes
  for (const gn of currentGraph.gnodes.values()) {
    const { x, y } = pos.get(gn.key);
    const fo = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
    fo.setAttribute("x", x); fo.setAttribute("y", y);
    fo.setAttribute("width", NODE_W); fo.setAttribute("height", NODE_H);
    const div = document.createElement("div");
    let innerHtml;
    if (gn.external) {
      innerHtml = `<div class="gtype">→ other conversation</div><div class="gtext">${escapeHtml(gn.flowId)}</div>`;
    } else {
      const { speaker, text } = hasDialogueText(gn.node) ? speakerAndText(gn.node, currentGraph.nodes) : {};
      innerHtml = `<div class="gtype">${escapeHtml(prettyCardType(gn.node))}</div>`;
      if (speaker) innerHtml += `<div class="gspeaker">${escapeHtml(speaker)}</div>`;
      innerHtml += `<div class="gtext">${escapeHtml(text || "")}</div>`;
      if (CHECK_TYPES.has(gn.node.type)) {
        const skill = prettySkill(gn.node.m_skillID);
        const bits = [];
        if (skill) bits.push(skill);
        if (gn.node.m_threshold !== undefined) bits.push(`DC ${gn.node.m_threshold}`);
        if (bits.length) innerHtml += `<div class="gskill">${escapeHtml(bits.join(" · "))}</div>`;
      }
      if (gn.node.type === "RtC4ForkCard") {
        const condText = forkConditionText(gn.node, currentGraph.nodes);
        if (condText) innerHtml += `<div class="gcondition">${escapeHtml(condText)}</div>`;
      }
    }
    div.className = `gnode-box type-${nodeTypeClass(gn.external ? null : gn.node)}`;
    if (gn.key === selectedNodeKey) div.classList.add("selected");
    if (connectedKeys && !connectedKeys.has(gn.key)) div.classList.add("dimmed");
    if (!gn.external && activeFilter?.type === "character") {
      const { speaker } = hasDialogueText(gn.node) ? speakerAndText(gn.node, currentGraph.nodes) : {};
      if (speaker === activeFilter.value) div.classList.add("highlight");
    }
    if (gn.node?.type === "RtC4JumpCard") div.title = "Double-click to jump to where this goes";
    div.innerHTML = innerHtml;
    div.addEventListener("click", (ev) => { ev.stopPropagation(); onNodeClick(gn); });
    div.addEventListener("dblclick", (ev) => { ev.stopPropagation(); onNodeDoubleClick(gn); });
    fo.appendChild(div);
    g.appendChild(fo);
  }

  svg.appendChild(g);
  drawLegend();
}

function drawLegend(targetId = "legend") {
  const el = document.getElementById(targetId);
  const items = [
    ["#3ba55d", "start/end"], ["#5865f2", "dialogue"], ["#faa61a", "fork (condition)"],
    ["#949cf7", "hub"], ["#ed4245", "jump"], ["#3ba57a", "passive check"],
    ["#d1495b", "anti-passive check"], ["#9aa0a6", "white/red check"], ["transparent", "other conversation"],
  ];
  el.innerHTML = items.map(([c, l]) => `<span><i style="background:${c};${c==='transparent'?'border:1px dashed var(--muted)':''}"></i>${l}</span>`).join("");
}

async function onNodeClick(gn) {
  selectedNodeKey = gn.key;
  connectedKeys = computeConnectedKeys(gn.key);
  drawGraph();
  updateHash(gn.external ? null : gn.key);
  const panel = document.getElementById("detailPanel");
  panel.style.display = "block";
  if (gn.external) {
    panel.innerHTML = `
      <span class="closeBtn" onclick="document.getElementById('detailPanel').style.display='none'">&times;</span>
      <h3>Continues in another conversation</h3>
      <div style="margin-top:10px"><button id="jumpBtn" class="branch-btn" style="max-width:none">Open that conversation &rarr;</button></div>
      <details class="raw"><summary>raw reference</summary><pre>${escapeHtml(JSON.stringify({ flowId: gn.flowId, cardId: gn.cardId }, null, 1))}</pre></details>
    `;
    document.getElementById("jumpBtn").addEventListener("click", async () => {
      const resolved = await resolveCardTarget(gn.cardId, gn.flowId);
      if (resolved) await selectFlow(gn.flowId, resolved.file, resolved.rid);
      else {
        const file = flowFileMap.get(gn.flowId);
        if (file) await selectFlow(gn.flowId, file); // fall back to the flow's default view
      }
    });
  } else {
    panel.innerHTML = `
      <span class="closeBtn" onclick="document.getElementById('detailPanel').style.display='none'">&times;</span>
      <h3>${escapeHtml(prettyCardType(gn.node))}</h3>
      <div style="margin:8px 0">${cardBodyHtml(gn.node, currentGraph.nodes)}</div>
      <details class="raw"><summary>raw node data</summary><pre>${escapeHtml(JSON.stringify(gn.node, null, 1))}</pre></details>
    `;
    if (gn.node.type === "RtC4JumpCard") {
      const targetKey = resolveJumpTargetKey(gn);
      const targetGn = targetKey ? currentGraph.gnodes.get(targetKey) : null;
      if (targetGn) {
        const btn = document.createElement("button");
        btn.className = "branch-btn";
        btn.style.maxWidth = "none";
        btn.style.marginTop = "10px";
        btn.textContent = "Jump to destination → (or just double-click the node)";
        btn.addEventListener("click", () => onNodeDoubleClick(gn));
        panel.appendChild(btn);
      }
    }
  }
}

// Jump cards (RtC4JumpCard) are pure "goto" nodes: no dialogue, no branches,
// exactly one outgoing edge — often looping back to an earlier Hub. Rather
// than re-deriving the target from scratch, reuse the edge buildGraph() already
// computed for this node (there's exactly one).
function resolveJumpTargetKey(gn) {
  if (!gn.node || gn.node.type !== "RtC4JumpCard") return null;
  const edge = currentGraph.edges.find(e => e.from === gn.key);
  return edge ? edge.to : null;
}
async function onNodeDoubleClick(gn) {
  const targetKey = resolveJumpTargetKey(gn);
  if (!targetKey) return;
  const targetGn = currentGraph.gnodes.get(targetKey);
  if (!targetGn) return;
  if (targetGn.external) {
    const resolved = await resolveCardTarget(targetGn.cardId, targetGn.flowId);
    if (resolved) {
      await selectFlow(targetGn.flowId, resolved.file, resolved.rid);
    } else {
      const file = flowFileMap.get(targetGn.flowId);
      if (file) await selectFlow(targetGn.flowId, file); // fall back to the flow's default view
    }
  } else {
    centerOnNode(targetGn);
    await onNodeClick(targetGn);
  }
}

// pan & zoom
const graphWrap = document.getElementById("graphWrap");
let dragging = false, dragStart = null, dragMoved = false;
graphWrap.addEventListener("mousedown", (e) => {
  dragging = true; dragMoved = false; dragStart = { x: e.clientX, y: e.clientY, panX, panY };
  graphWrap.classList.add("panning");
});
window.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  if (Math.abs(e.clientX - dragStart.x) > 3 || Math.abs(e.clientY - dragStart.y) > 3) dragMoved = true;
  panX = dragStart.panX + (e.clientX - dragStart.x);
  panY = dragStart.panY + (e.clientY - dragStart.y);
  const g = document.getElementById("viewport");
  if (g) g.setAttribute("transform", `translate(${panX},${panY}) scale(${zoom})`);
});
window.addEventListener("mouseup", () => { dragging = false; graphWrap.classList.remove("panning"); });
graphWrap.addEventListener("click", () => {
  if (dragMoved) return; // was a pan drag, not a click on empty background
  if (selectedNodeKey === null && connectedKeys === null) return;
  selectedNodeKey = null;
  connectedKeys = null;
  document.getElementById("detailPanel").style.display = "none";
  drawGraph();
  updateHash();
});
graphWrap.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = graphWrap.getBoundingClientRect();
  const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
  const worldX = (mouseX - panX) / zoom, worldY = (mouseY - panY) / zoom;
  const factor = Math.exp(-e.deltaY * 0.0015);
  zoom = Math.min(8, Math.max(0.1, zoom * factor));
  panX = mouseX - worldX * zoom;
  panY = mouseY - worldY * zoom;
  const g = document.getElementById("viewport");
  if (g) g.setAttribute("transform", `translate(${panX},${panY}) scale(${zoom})`);
}, { passive: false });
document.getElementById("zoomResetBtn").addEventListener("click", () => {
  if (viewMode === "universe") {
    if (universeClusters) { fitUniverseView(); scheduleDrawUniverse(); }
    return;
  }
  panX = 0; panY = 40; zoom = 1;
  const g = document.getElementById("viewport");
  if (g) g.setAttribute("transform", `translate(${panX},${panY}) scale(${zoom})`);
});

/* ================= UNIVERSE MODE (every conversation at once) =================
 * Up to ~78,000 cards across 1,414 conversations -- one DOM element per node
 * (the SVG/foreignObject approach the per-conversation Graph view uses) does
 * not scale to that. This renders to a single <canvas> instead: no per-node
 * DOM cost, viewport culling (skip whole clusters outside the visible area
 * before even touching their nodes), and level-of-detail (skip text entirely
 * until zoomed in far enough to read it). Each conversation keeps its own
 * local layout (same depth/lane algorithm as the per-conversation view) and
 * conversations are shelf-packed next to each other with no attempt to draw
 * connections between them -- "floating adjacently," per the brief. Jump
 * cards can still fast-travel across conversations on double-click via a
 * global cardKey->location index, even though nothing is drawn between them.
 */
let universeClusters = null; // [{flowId, file, gnodes, edges, nodes, offsetX, offsetY, width, height}]
let universeCardLocation = null; // "flowId::cardId" -> {cluster, gn, absX, absY}
let uPanX = 0, uPanY = 0, uZoom = 0.15;
let uSelected = null; // {cluster, gn}
let uConnectedKeys = null; // Set of gn.key, scoped to uSelected.cluster
let uDrawScheduled = false;

const UNIVERSE_MAX_ROW_WIDTH = 26000;
const UNIVERSE_CLUSTER_GAP = 160;
const UNIVERSE_LOD_TEXT_ZOOM = 0.4;
const UNIVERSE_LOD_MIN_ZOOM = 0.02;

const NODE_COLORS = {
  start: "#3ba55d", end: "#3ba55d", bark: "#5865f2", frag: "#5865f2", janus: "#5865f2",
  fork: "#faa61a", hub: "#949cf7", jump: "#ed4245", passive: "#3ba57a", antipassive: "#d1495b",
  check: "#9aa0a6", other: "#5c6067", external: "#6a6d73",
};
function nodeColor(gn) {
  return NODE_COLORS[nodeTypeClass(gn.external ? null : gn.node)] || "#5c6067";
}

/* ---- character-relationship layout: group conversations by their primary
 * speaker, then place those per-character blocks via a force-directed graph
 * where two characters pull together the more conversations they share
 * (co-occurrence -- both have dialogue in the same conversation), so the
 * clustering reflects the actual social web rather than an arbitrary shelf
 * order. Conversations with no clear speaker (mechanical/instruction-only
 * flows) get their own "Other" area rather than being forced onto a
 * character they don't really belong to. */
let universeCharacterBlocks = null; // [{char, anchorX, anchorY, width, height, clusterCount}]
let universeCharacterEdges = null; // [{ax1,ay1,ax2,ay2,weight}]

function buildCharacterCoOccurrence() {
  const coOccur = new Map(); // "A|B" (A<B) -> shared-conversation count
  const charSet = new Set();
  for (const f of flowsIndex) {
    // f.speakers includes skill-voiced passive-check "speakers" (see the
    // skill-block layout above) -- exclude those here too, or they'd pollute
    // the character-relationship web with pseudo-characters like "presence".
    const speakers = (f.speakers || []).filter(s => !(s in SKILL_NAMES));
    for (const s of speakers) charSet.add(s);
    for (let i = 0; i < speakers.length; i++) {
      for (let j = i + 1; j < speakers.length; j++) {
        const a = speakers[i] < speakers[j] ? speakers[i] : speakers[j];
        const b = speakers[i] < speakers[j] ? speakers[j] : speakers[i];
        const key = `${a}|${b}`;
        coOccur.set(key, (coOccur.get(key) || 0) + 1);
      }
    }
  }
  return { characters: [...charSet], coOccur };
}

// Simple force-directed layout (repulsion between every pair + spring
// attraction along co-occurrence edges, weight-scaled). Cheap at ~100
// characters (O(n^2) per iteration is trivial at this n) even though the
// conversation graphs it's arranging are individually huge.
function forceDirectedCharacterLayout(characters, coOccur, iterations = 400) {
  const n = characters.length;
  const idx = new Map(characters.map((c, i) => [c, i]));
  const pos = characters.map((_, i) => {
    const angle = (i / n) * Math.PI * 2;
    return { x: Math.cos(angle) * 10, y: Math.sin(angle) * 10 };
  });
  const vel = characters.map(() => ({ x: 0, y: 0 }));
  const edges = [];
  for (const [key, weight] of coOccur) {
    const [a, b] = key.split("|");
    edges.push({ a: idx.get(a), b: idx.get(b), weight });
  }

  const REPULSION = 90, SPRING = 0.02, DAMPING = 0.85;
  for (let iter = 0; iter < iterations; iter++) {
    const force = characters.map(() => ({ x: 0, y: 0 }));
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        let dx = pos[i].x - pos[j].x, dy = pos[i].y - pos[j].y;
        let distSq = dx * dx + dy * dy;
        if (distSq < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; distSq = 0.01; }
        const dist = Math.sqrt(distSq);
        const f = REPULSION / distSq;
        const fx = (dx / dist) * f, fy = (dy / dist) * f;
        force[i].x += fx; force[i].y += fy;
        force[j].x -= fx; force[j].y -= fy;
      }
    }
    for (const e of edges) {
      const dx = pos[e.a].x - pos[e.b].x, dy = pos[e.a].y - pos[e.b].y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const restLength = 8 / Math.sqrt(e.weight); // more shared scenes -> pulled closer
      const f = SPRING * e.weight * (dist - restLength);
      const fx = (dx / dist) * f, fy = (dy / dist) * f;
      force[e.a].x -= fx; force[e.a].y -= fy;
      force[e.b].x += fx; force[e.b].y += fy;
    }
    const MAX_SPEED = 12; // caps how far a node can move in one step
    for (let i = 0; i < n; i++) {
      vel[i].x = (vel[i].x + force[i].x) * DAMPING;
      vel[i].y = (vel[i].y + force[i].y) * DAMPING;
      const speed = Math.sqrt(vel[i].x * vel[i].x + vel[i].y * vel[i].y);
      if (speed > MAX_SPEED) {
        vel[i].x = (vel[i].x / speed) * MAX_SPEED;
        vel[i].y = (vel[i].y / speed) * MAX_SPEED;
      }
      pos[i].x += vel[i].x;
      pos[i].y += vel[i].y;
    }
  }

  const result = new Map();
  characters.forEach((c, i) => result.set(c, pos[i]));
  return { positions: result, edges };
}

function squarishRowWidth(list) {
  // Row width based on cluster *count* alone badly misjudges characters whose
  // conversations vary hugely in size (some are 700+ nodes across dozens of
  // columns, others are a couple of nodes) -- baseline width for a roughly
  // square final block instead: classic bin-packing heuristic, target row
  // width ~= sqrt(total area), with a fudge factor for imperfect packing.
  const totalArea = list.reduce((sum, c) => sum + c.width * c.height, 0);
  return Math.max(COL_W + COL_GAP, Math.sqrt(totalArea) * 1.3);
}

function resolveBlockOverlaps(blocks, iterations = 400) {
  // Simple iterative rectangle-separation pass: for each overlapping pair,
  // push both apart (split evenly) along whichever axis has the smaller
  // overlap, so two blocks separate via the shortest path rather than always
  // shoving along one fixed axis. Repeats until stable or the iteration cap.
  for (let iter = 0; iter < iterations; iter++) {
    let anyOverlap = false;
    for (let i = 0; i < blocks.length; i++) {
      for (let j = i + 1; j < blocks.length; j++) {
        const a = blocks[i], b = blocks[j];
        const ax0 = a.anchorX - a.width / 2, ax1 = a.anchorX + a.width / 2;
        const ay0 = a.anchorY - a.height / 2, ay1 = a.anchorY + a.height / 2;
        const bx0 = b.anchorX - b.width / 2, bx1 = b.anchorX + b.width / 2;
        const by0 = b.anchorY - b.height / 2, by1 = b.anchorY + b.height / 2;
        const overlapX = Math.min(ax1, bx1) - Math.max(ax0, bx0);
        const overlapY = Math.min(ay1, by1) - Math.max(ay0, by0);
        if (overlapX <= 0 || overlapY <= 0) continue;
        anyOverlap = true;
        const ddx = b.anchorX - a.anchorX, ddy = b.anchorY - a.anchorY;
        if (overlapX < overlapY) {
          const push = (overlapX / 2 + 15) * (ddx >= 0 ? 1 : -1);
          a.anchorX -= push; b.anchorX += push;
        } else {
          const push = (overlapY / 2 + 15) * (ddy >= 0 ? 1 : -1);
          a.anchorY -= push; b.anchorY += push;
        }
      }
    }
    if (!anyOverlap) break;
  }
}

function shelfPackList(list, maxRowWidth) {
  let shelfX = 0, shelfY = 0, shelfMaxH = 0;
  for (const c of list) {
    if (shelfX > 0 && shelfX + c.width > maxRowWidth) {
      shelfY += shelfMaxH + UNIVERSE_CLUSTER_GAP;
      shelfX = 0;
      shelfMaxH = 0;
    }
    c.localX = shelfX;
    c.localY = shelfY;
    shelfX += c.width + UNIVERSE_CLUSTER_GAP;
    shelfMaxH = Math.max(shelfMaxH, c.height);
  }
  return { width: shelfX > 0 ? Math.max(...list.map(c => c.localX + c.width)) : 0, height: shelfY + shelfMaxH };
}

function layoutUniverseByCharacter(clusters) {
  const { characters, coOccur } = buildCharacterCoOccurrence();
  const { positions, edges } = forceDirectedCharacterLayout(characters, coOccur);

  // Three zones, stacked vertically so none can overlap regardless of each
  // zone's own shape: (1) the character web -- real speaking characters,
  // force-directed by co-occurrence, the actual point of this layout; (2) a
  // skill zone -- turns out ~60% of flows are *entirely* skill-voiced internal
  // monologue (not just an occasional passive-check line), so those get their
  // own grid of skill-labeled blocks instead of diluting either the character
  // web or the catch-all; (3) "Other" -- genuinely speakerless flows (mostly
  // mechanical fork/instruction-only sequences with no dialogue at all).
  const flowMetaByFlowId = new Map(flowsIndex.map(f => [f.flowId, f]));
  const byChar = new Map();
  const bySkill = new Map();
  const otherClusters = [];
  for (const c of clusters) {
    const f = flowMetaByFlowId.get(c.flowId);
    if (f && f.primarySpeaker) {
      if (!byChar.has(f.primarySpeaker)) byChar.set(f.primarySpeaker, []);
      byChar.get(f.primarySpeaker).push(c);
    } else if (f && f.primarySkillSpeaker) {
      if (!bySkill.has(f.primarySkillSpeaker)) bySkill.set(f.primarySkillSpeaker, []);
      bySkill.get(f.primarySkillSpeaker).push(c);
    } else {
      otherClusters.push(c);
    }
  }

  const blocks = [];
  for (const [char, list] of byChar) {
    const rowWidth = squarishRowWidth(list);
    const { width, height } = shelfPackList(list, rowWidth);
    blocks.push({ kind: "character", label: char, clusters: list, width, height, force: positions.get(char) || { x: 0, y: 0 } });
  }

  // Deliberately a small FIXED scale, not one derived from block sizes --
  // scaling every abstract force-layout coordinate by a size-based factor
  // stretches *every* pair uniformly, including characters the simulation
  // already placed appropriately close together. Real overlap-avoidance is
  // resolveBlockOverlaps()'s job below, which only pushes apart the specific
  // pairs that actually need it (in practice, just the handful of biggest
  // characters), leaving small/closely-related characters naturally close.
  const SPACING_SCALE = 130;
  for (const block of blocks) {
    block.anchorX = block.force.x * SPACING_SCALE;
    block.anchorY = block.force.y * SPACING_SCALE;
  }
  // Percentile-based spacing above trades a small chance of overlap for a
  // much more compact layout; clean up any remaining overlaps (almost always
  // just among the handful of biggest characters) here instead.
  resolveBlockOverlaps(blocks);
  for (const block of blocks) {
    const originX = block.anchorX - block.width / 2, originY = block.anchorY - block.height / 2;
    for (const c of block.clusters) {
      c.offsetX = originX + c.localX;
      c.offsetY = originY + c.localY;
    }
  }

  let minX = 0, maxX = 0, maxCharBottom = 0;
  for (const block of blocks) {
    minX = Math.min(minX, block.anchorX - block.width / 2);
    maxX = Math.max(maxX, block.anchorX + block.width / 2);
    maxCharBottom = Math.max(maxCharBottom, block.anchorY + block.height / 2);
  }

  // Skill zone: simple grid (only 15 of them, no need for force-layout) just
  // below the character web.
  const skillZoneTop = maxCharBottom + UNIVERSE_CLUSTER_GAP * 5;
  let skillX = minX, skillRowY = skillZoneTop, skillRowMaxH = 0, skillZoneBottom = skillZoneTop;
  const skillBlocks = [];
  for (const [skill, list] of bySkill) {
    const rowWidth = squarishRowWidth(list);
    const { width, height } = shelfPackList(list, rowWidth);
    if (skillX > minX && skillX + width > maxX) {
      skillRowY += skillRowMaxH + UNIVERSE_CLUSTER_GAP;
      skillX = minX;
      skillRowMaxH = 0;
    }
    skillBlocks.push({ kind: "skill", label: skill, clusters: list, width, height, x: skillX, y: skillRowY });
    skillX += width + UNIVERSE_CLUSTER_GAP;
    skillRowMaxH = Math.max(skillRowMaxH, height);
    skillZoneBottom = Math.max(skillZoneBottom, skillRowY + skillRowMaxH);
  }
  for (const b of skillBlocks) {
    b.anchorX = b.x + b.width / 2;
    b.anchorY = b.y + b.height / 2;
    for (const c of b.clusters) {
      c.offsetX = b.x + c.localX;
      c.offsetY = b.y + c.localY;
    }
    blocks.push(b);
  }

  if (otherClusters.length) {
    const { width, height } = shelfPackList(otherClusters, UNIVERSE_MAX_ROW_WIDTH);
    const otherOriginY = skillZoneBottom + UNIVERSE_CLUSTER_GAP * 5;
    for (const c of otherClusters) {
      c.offsetX = minX + c.localX;
      c.offsetY = otherOriginY + c.localY;
    }
    blocks.push({
      kind: "other", label: "Other (no clear speaker)", clusters: otherClusters, width, height,
      anchorX: minX + width / 2, anchorY: otherOriginY + height / 2,
    });
  }

  // Normalize everything to non-negative coordinates (force layout spreads
  // around the origin in both directions; the rest of universe rendering
  // assumes a 0,0-anchored top-left the way fitUniverseView computes it).
  let normMinX = 0, normMinY = 0;
  for (const c of clusters) { normMinX = Math.min(normMinX, c.offsetX); normMinY = Math.min(normMinY, c.offsetY); }
  for (const block of blocks) { normMinX = Math.min(normMinX, block.anchorX - block.width / 2); normMinY = Math.min(normMinY, block.anchorY - block.height / 2); }
  if (normMinX < 0 || normMinY < 0) {
    for (const c of clusters) { c.offsetX -= normMinX; c.offsetY -= normMinY; }
    for (const block of blocks) { block.anchorX -= normMinX; block.anchorY -= normMinY; }
  }

  universeCharacterBlocks = blocks.map(b => ({ kind: b.kind, char: b.label, anchorX: b.anchorX, anchorY: b.anchorY, width: b.width, height: b.height, clusterCount: b.clusters.length }));
  const idxByChar = new Map(universeCharacterBlocks.filter(b => b.kind === "character").map(b => [b.char, b]));
  universeCharacterEdges = edges
    .map(e => {
      const ca = characters[e.a], cb = characters[e.b];
      const ba = idxByChar.get(ca), bb = idxByChar.get(cb);
      if (!ba || !bb) return null;
      return { ax1: ba.anchorX, ay1: ba.anchorY, ax2: bb.anchorX, ay2: bb.anchorY, weight: e.weight };
    })
    .filter(Boolean);
}

async function loadUniverse() {
  const overlay = document.getElementById("universeLoading");
  if (universeClusters) { scheduleDrawUniverse(); return; } // already built once this session

  overlay.style.display = "flex";
  const textEl = document.getElementById("universeLoadingText");
  const clusters = [];
  const total = flowsIndex.length;

  for (let i = 0; i < total; i++) {
    const f = flowsIndex[i];
    const chunk = await getChunk(f.file);
    const g = buildFlowGraphFromChunk(f.flowId, chunk);
    let maxDepth = 0, maxLane = 0;
    for (const gn of g.gnodes.values()) {
      if (gn.depth > maxDepth) maxDepth = gn.depth;
      if (gn.lane !== undefined && gn.lane > maxLane) maxLane = gn.lane;
    }
    clusters.push({
      flowId: f.flowId, file: f.file, gnodes: g.gnodes, edges: g.edges, nodes: g.nodes,
      width: (maxDepth + 1) * (COL_W + COL_GAP),
      height: (maxLane + 1) * (ROW_H + ROW_GAP),
    });
    if (i % 15 === 0 || i === total - 1) {
      textEl.textContent = `Loading all conversations... ${i + 1}/${total}`;
      await new Promise(r => setTimeout(r, 0)); // yield so the overlay text actually paints
    }
  }

  textEl.textContent = "Arranging by character relationships...";
  await new Promise(r => setTimeout(r, 0));
  layoutUniverseByCharacter(clusters);

  const cardLoc = new Map();
  for (const c of clusters) {
    for (const gn of c.gnodes.values()) {
      if (gn.external) continue;
      const { x, y } = nodeXY(gn);
      cardLoc.set(`${c.flowId}::${gn.node.m_cardId}`, { cluster: c, gn, absX: c.offsetX + x, absY: c.offsetY + y });
    }
  }

  universeClusters = clusters;
  universeCardLocation = cardLoc;
  overlay.style.display = "none";
  fitUniverseView();
  scheduleDrawUniverse();
  drawLegend("universeLegend");
}

function getUniverseRect() {
  // getBoundingClientRect() can come back all-zeros right when #universeWrap
  // has just been switched to display:block (layout hasn't caught up yet --
  // seen reliably in headless Chrome, and plausible in a real browser under
  // similar first-paint timing). Dividing by a zero-sized rect corrupts
  // uZoom/uPanX to NaN/Infinity for the rest of the session, not just this
  // one call, so fall back to a sane estimate rather than trusting it blindly.
  const rect = document.getElementById("universeWrap").getBoundingClientRect();
  if (rect.width > 0 && rect.height > 0) return rect;
  return { width: Math.max(1, window.innerWidth - 380), height: Math.max(1, window.innerHeight - 90), left: 0, top: 0 };
}

function fitUniverseView() {
  const rect = getUniverseRect();
  let maxX = 1, maxY = 1;
  for (const c of universeClusters) {
    maxX = Math.max(maxX, c.offsetX + c.width);
    maxY = Math.max(maxY, c.offsetY + c.height);
  }
  uZoom = Math.min(rect.width / maxX, rect.height / maxY) * 0.95;
  uPanX = (rect.width - maxX * uZoom) / 2;
  uPanY = (rect.height - maxY * uZoom) / 2;
}

function scheduleDrawUniverse() {
  if (uDrawScheduled) return;
  uDrawScheduled = true;
  requestAnimationFrame(() => { uDrawScheduled = false; drawUniverse(); });
}

function drawUniverse() {
  const canvas = document.getElementById("universeCanvas");
  const rect = getUniverseRect();
  const dpr = window.devicePixelRatio || 1;
  const pxW = Math.max(1, Math.round(rect.width * dpr)), pxH = Math.max(1, Math.round(rect.height * dpr));
  if (canvas.width !== pxW || canvas.height !== pxH) {
    canvas.width = pxW;
    canvas.height = pxH;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bgColor = getComputedStyle(document.documentElement).getPropertyValue("--canvas-bg").trim() || "#202225";
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, rect.width, rect.height);
  if (!universeClusters) return;

  ctx.save();
  ctx.translate(uPanX, uPanY);
  ctx.scale(uZoom, uZoom);

  const vx0 = -uPanX / uZoom, vy0 = -uPanY / uZoom;
  const vx1 = vx0 + rect.width / uZoom, vy1 = vy0 + rect.height / uZoom;
  const showText = uZoom > UNIVERSE_LOD_TEXT_ZOOM;
  const showNodes = uZoom > UNIVERSE_LOD_MIN_ZOOM;

  // character-relationship web, drawn underneath everything -- visible at
  // any zoom level since it's cheap (~one line per co-occurring character
  // pair, not per-card) and is the whole point of this layout.
  if (universeCharacterEdges) {
    for (const e of universeCharacterEdges) {
      if (Math.max(e.ax1, e.ax2) < vx0 || Math.min(e.ax1, e.ax2) > vx1 || Math.max(e.ay1, e.ay2) < vy0 || Math.min(e.ay1, e.ay2) > vy1) continue;
      ctx.strokeStyle = `rgba(148,156,247,${Math.min(0.5, 0.08 + e.weight * 0.015)})`;
      ctx.lineWidth = Math.min(6, 0.6 + e.weight * 0.15) / uZoom;
      ctx.beginPath();
      ctx.moveTo(e.ax1, e.ay1);
      ctx.lineTo(e.ax2, e.ay2);
      ctx.stroke();
    }
  }

  for (const c of universeClusters) {
    const cx1 = c.offsetX + c.width, cy1 = c.offsetY + c.height;
    if (cx1 < vx0 || c.offsetX > vx1 || cy1 < vy0 || c.offsetY > vy1) continue; // whole cluster off-screen

    if (showNodes) {
      ctx.lineWidth = 1.2 / uZoom;
      for (const e of c.edges) {
        const a = c.gnodes.get(e.from), b = c.gnodes.get(e.to);
        if (!a || !b) continue;
        const ap = nodeXY(a), bp = nodeXY(b);
        const x1 = c.offsetX + ap.x + NODE_W, y1 = c.offsetY + ap.y + NODE_H / 2;
        const x2 = c.offsetX + bp.x, y2 = c.offsetY + bp.y + NODE_H / 2;
        ctx.strokeStyle = e.pinName === "fail" ? "#ed4245" : (e.pinName === "critical_failure" ? "#c246d1" : "#8e929780");
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    } else {
      // too far zoomed out for individual nodes to matter -- draw one blob for the whole cluster
      ctx.fillStyle = "#5865f299";
      ctx.fillRect(c.offsetX, c.offsetY, c.width, c.height);
      continue;
    }

    for (const gn of c.gnodes.values()) {
      const p = nodeXY(gn);
      const absX = c.offsetX + p.x, absY = c.offsetY + p.y;
      if (absX + NODE_W < vx0 || absX > vx1 || absY + NODE_H < vy0 || absY > vy1) continue;
      drawUniverseNode(ctx, gn, c, absX, absY, showText);
    }
  }
  ctx.restore();

  // character name labels, drawn in screen space (outside the zoom
  // transform) so they stay a constant, legible size no matter how far
  // zoomed out you are -- these are the primary way to navigate the atlas.
  if (universeCharacterBlocks) {
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    for (const b of universeCharacterBlocks) {
      const sx = b.anchorX * uZoom + uPanX, sy = b.anchorY * uZoom + uPanY;
      if (sx < -100 || sx > rect.width + 100 || sy < -40 || sy > rect.height + 40) continue;
      const fontSize = Math.max(11, Math.min(22, 10 + Math.log2(b.clusterCount + 1) * 2.2));
      ctx.font = `700 ${fontSize}px -apple-system, sans-serif`;
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(0,0,0,0.65)";
      ctx.fillStyle = b.kind === "skill" ? "#faa61a" : (b.kind === "other" ? "#8e9297" : "#fff");
      const display = b.kind === "skill" ? `⚙ ${prettySkill(b.char)}`
        : b.kind === "other" ? b.char
        : (b.char.charAt(0).toUpperCase() + b.char.slice(1));
      ctx.strokeText(display, sx, sy - (showTextOffsetFor(b)));
      ctx.fillText(display, sx, sy - (showTextOffsetFor(b)));
    }
  }
}
function showTextOffsetFor(b) {
  // float the label just above the block once zoomed in enough that the
  // block itself is visually large; keep it centered when still zoomed way out
  return uZoom > 0.15 ? (b.height / 2) * uZoom + 14 : 0;
}

function drawUniverseNode(ctx, gn, cluster, x, y, showText) {
  const isSelected = uSelected && uSelected.gn.key === gn.key && uSelected.cluster === cluster;
  const dimmed = uConnectedKeys && uSelected.cluster === cluster && !uConnectedKeys.has(gn.key);
  ctx.globalAlpha = dimmed ? 0.15 : 1;
  ctx.fillStyle = nodeColor(gn);
  const r = 5;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, NODE_W, NODE_H, r) : ctx.rect(x, y, NODE_W, NODE_H);
  ctx.fill();
  if (isSelected) {
    ctx.lineWidth = 2.5 / uZoom;
    ctx.strokeStyle = "#ffd166";
    ctx.stroke();
  }
  if (showText && !gn.external) {
    ctx.fillStyle = "#fff";
    ctx.font = "10px -apple-system, sans-serif";
    ctx.textBaseline = "top";
    const label = summarizeText(gn.node, cluster.nodes);
    ctx.fillText(truncateToWidth(ctx, label, NODE_W - 8), x + 5, y + 6);
    ctx.font = "8px -apple-system, sans-serif";
    ctx.globalAlpha = (dimmed ? 0.15 : 0.7);
    ctx.fillText(prettyCardType(gn.node), x + 5, y + NODE_H - 14);
  }
  ctx.globalAlpha = 1;
}
function truncateToWidth(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let lo = 0, hi = text.length;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (ctx.measureText(text.slice(0, mid) + "...").width <= maxWidth) lo = mid; else hi = mid - 1;
  }
  return text.slice(0, lo) + "...";
}

function universeHitTest(worldX, worldY) {
  for (const c of universeClusters) {
    if (worldX < c.offsetX || worldX > c.offsetX + c.width || worldY < c.offsetY || worldY > c.offsetY + c.height) continue;
    for (const gn of c.gnodes.values()) {
      const p = nodeXY(gn);
      const absX = c.offsetX + p.x, absY = c.offsetY + p.y;
      if (worldX >= absX && worldX <= absX + NODE_W && worldY >= absY && worldY <= absY + NODE_H) {
        return { cluster: c, gn, absX, absY };
      }
    }
  }
  return null;
}

function onUniverseNodeSelect(hit) {
  uSelected = hit;
  uConnectedKeys = new Set([hit.gn.key]);
  for (const e of hit.cluster.edges) {
    if (e.from === hit.gn.key) uConnectedKeys.add(e.to);
    if (e.to === hit.gn.key) uConnectedKeys.add(e.from);
  }
  scheduleDrawUniverse();

  const panel = document.getElementById("detailPanel");
  panel.style.display = "block";
  if (hit.gn.external) {
    const loc = universeCardLocation.get(`${hit.gn.flowId}::${hit.gn.cardId}`);
    panel.innerHTML = `
      <span class="closeBtn" onclick="document.getElementById('detailPanel').style.display='none'">&times;</span>
      <h3>Continues in another conversation</h3>
      <div class="kv"><b>Conversation:</b> ${escapeHtml(hit.gn.flowId)}</div>
      ${loc ? `<div style="margin-top:10px"><button id="uJumpBtn" class="branch-btn" style="max-width:none">Fly to that conversation &rarr;</button></div>` : `<div class="alt-note">That target isn't reachable from any conversation's own start card, so it isn't placed anywhere in this view.</div>`}
    `;
    if (loc) document.getElementById("uJumpBtn").addEventListener("click", () => flyToUniverseLocation(loc));
  } else {
    panel.innerHTML = `
      <span class="closeBtn" onclick="document.getElementById('detailPanel').style.display='none'">&times;</span>
      <h3>${escapeHtml(prettyCardType(hit.gn.node))} <span style="font-weight:400;opacity:0.6;font-size:11px">— ${escapeHtml(hit.cluster.flowId)}</span></h3>
      <div style="margin:8px 0">${cardBodyHtml(hit.gn.node, hit.cluster.nodes)}</div>
      <details class="raw"><summary>raw node data</summary><pre>${escapeHtml(JSON.stringify(hit.gn.node, null, 1))}</pre></details>
    `;
  }
}

function flyToUniverseLocation(loc) {
  const rect = getUniverseRect();
  uZoom = 1;
  uPanX = rect.width / 2 - (loc.absX + NODE_W / 2) * uZoom;
  uPanY = rect.height / 2 - (loc.absY + NODE_H / 2) * uZoom;
  onUniverseNodeSelect(loc);
}

function universeJumpTarget(hit) {
  const edge = hit.cluster.edges.find(e => e.from === hit.gn.key);
  if (!edge) return null;
  const targetGn = hit.cluster.gnodes.get(edge.to);
  if (!targetGn) return null;
  if (!targetGn.external) {
    const p = nodeXY(targetGn);
    return { cluster: hit.cluster, gn: targetGn, absX: hit.cluster.offsetX + p.x, absY: hit.cluster.offsetY + p.y };
  }
  return universeCardLocation.get(`${targetGn.flowId}::${targetGn.cardId}`) || null;
}

const universeWrap = document.getElementById("universeWrap");
let uDragging = false, uDragStart = null, uDragMoved = false;
universeWrap.addEventListener("mousedown", (e) => {
  uDragging = true; uDragMoved = false; uDragStart = { x: e.clientX, y: e.clientY, panX: uPanX, panY: uPanY };
  universeWrap.classList.add("panning");
});
window.addEventListener("mousemove", (e) => {
  if (!uDragging) return;
  if (Math.abs(e.clientX - uDragStart.x) > 3 || Math.abs(e.clientY - uDragStart.y) > 3) uDragMoved = true;
  uPanX = uDragStart.panX + (e.clientX - uDragStart.x);
  uPanY = uDragStart.panY + (e.clientY - uDragStart.y);
  scheduleDrawUniverse();
});
window.addEventListener("mouseup", () => { uDragging = false; universeWrap.classList.remove("panning"); });
universeWrap.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = getUniverseRect();
  const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
  const worldX = (mouseX - uPanX) / uZoom, worldY = (mouseY - uPanY) / uZoom;
  const factor = Math.exp(-e.deltaY * 0.0015);
  uZoom = Math.min(8, Math.max(0.002, uZoom * factor));
  uPanX = mouseX - worldX * uZoom;
  uPanY = mouseY - worldY * uZoom;
  scheduleDrawUniverse();
}, { passive: false });
universeWrap.addEventListener("click", (e) => {
  if (uDragMoved) return;
  const rect = getUniverseRect();
  const worldX = (e.clientX - rect.left - uPanX) / uZoom, worldY = (e.clientY - rect.top - uPanY) / uZoom;
  const hit = universeHitTest(worldX, worldY);
  if (hit) {
    onUniverseNodeSelect(hit);
  } else if (uSelected) {
    uSelected = null; uConnectedKeys = null;
    document.getElementById("detailPanel").style.display = "none";
    scheduleDrawUniverse();
  }
});
universeWrap.addEventListener("dblclick", (e) => {
  const rect = getUniverseRect();
  const worldX = (e.clientX - rect.left - uPanX) / uZoom, worldY = (e.clientY - rect.top - uPanY) / uZoom;
  const hit = universeHitTest(worldX, worldY);
  if (!hit || hit.gn.external) return;
  const target = universeJumpTarget(hit);
  if (target) flyToUniverseLocation(target);
});
window.addEventListener("resize", () => { if (universeClusters) scheduleDrawUniverse(); });

/* ---------------- mode switching ---------------- */
function hideAllModeViews() {
  document.getElementById("graphModeBtn").classList.remove("active");
  document.getElementById("readerModeBtn").classList.remove("active");
  document.getElementById("universeModeBtn").classList.remove("active");
  document.getElementById("graphWrap").style.display = "none";
  document.getElementById("readerScroll").style.display = "none";
  document.getElementById("universeWrap").style.display = "none";
  document.getElementById("detailPanel").style.display = "none";
}
document.getElementById("graphModeBtn").addEventListener("click", async () => {
  viewMode = "graph";
  hideAllModeViews();
  document.getElementById("graphModeBtn").classList.add("active");
  document.getElementById("graphWrap").style.display = "block";
  document.getElementById("backBtn").style.display = "none";
  document.getElementById("restartBtn").style.display = "none";
  document.getElementById("zoomResetBtn").style.display = "inline-block";
  document.getElementById("zoomResetBtn").disabled = !currentGraph;
  if (currentFlowId && currentFile) await openGraph(currentFlowId, currentFile);
});
document.getElementById("readerModeBtn").addEventListener("click", async () => {
  viewMode = "reader";
  hideAllModeViews();
  document.getElementById("readerModeBtn").classList.add("active");
  document.getElementById("readerScroll").style.display = "block";
  document.getElementById("backBtn").style.display = "inline-block";
  document.getElementById("restartBtn").style.display = "inline-block";
  document.getElementById("zoomResetBtn").style.display = "none";
  if (currentFlowId && currentFile) await openReaderStart(currentFlowId, currentFile);
});
document.getElementById("universeModeBtn").addEventListener("click", async () => {
  viewMode = "universe";
  hideAllModeViews();
  document.getElementById("universeModeBtn").classList.add("active");
  document.getElementById("universeWrap").style.display = "block";
  document.getElementById("backBtn").style.display = "none";
  document.getElementById("restartBtn").style.display = "none";
  document.getElementById("zoomResetBtn").style.display = "inline-block";
  document.getElementById("zoomResetBtn").disabled = false;
  document.getElementById("crumbInfo").textContent = "All conversations";
  await loadUniverse();
});

(async function init() {
  document.getElementById("zoomResetBtn").style.display = "inline-block";
  document.getElementById("backBtn").style.display = "none";
  document.getElementById("restartBtn").style.display = "none";
  flowsIndex = await loadJSON("flows_index.json");
  characters = await loadJSON("characters.json");
  skills = await loadJSON("skills.json");
  for (const f of flowsIndex) flowFileMap.set(f.flowId, f.file);
  renderFlowList("");
  loadJSON("search_index.json").then(data => { searchIndex = data; }); // big-ish (~13MB); don't block first paint on it

  const shared = parseHash();
  if (shared) {
    viewMode = shared.mode === "reader" ? "reader" : "graph";
    document.getElementById(viewMode === "reader" ? "readerModeBtn" : "graphModeBtn").classList.add("active");
    document.getElementById(viewMode === "reader" ? "graphModeBtn" : "readerModeBtn").classList.remove("active");
    document.getElementById("readerScroll").style.display = viewMode === "reader" ? "block" : "none";
    document.getElementById("graphWrap").style.display = viewMode === "reader" ? "none" : "block";
    document.getElementById("backBtn").style.display = viewMode === "reader" ? "inline-block" : "none";
    document.getElementById("restartBtn").style.display = viewMode === "reader" ? "inline-block" : "none";
    document.getElementById("zoomResetBtn").style.display = viewMode === "reader" ? "none" : "inline-block";
    try {
      await selectFlow(shared.flowId, shared.file, shared.node);
    } catch (e) {
      console.error("failed to restore shared link", e);
    }
  }
})();
</script>
