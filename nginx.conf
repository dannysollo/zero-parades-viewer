server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index viewer.html;

    gzip on;
    gzip_types application/json text/html;
    gzip_min_length 1024;

    # nginx:alpine's stock mime.types has no .opus entry, so it would fall
    # back to default_type (text/plain) and browsers may refuse to play it.
    # Scope the override to this location only so it doesn't clobber the
    # inherited mime.types map used for .json/.html elsewhere.
    location ~* \.opus$ {
        default_type audio/ogg;
    }

    location / {
        try_files $uri $uri/ /viewer.html;
    }
}
